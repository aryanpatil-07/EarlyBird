version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: earlybird-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: earlybird
      POSTGRES_PASSWORD: earlybird_dev
      POSTGRES_DB: earlybird_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earlybird -d earlybird_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - earlybird-network

  backend:
    build:
      context: ./
      dockerfile: backend/Dockerfile
    container_name: earlybird-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://earlybird:earlybird_dev@postgres:5432/earlybird_db
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - earlybird-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: earlybird-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/nginx_health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - earlybird-network

networks:
  earlybird-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
